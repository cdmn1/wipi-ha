name: WiPi Netbooter
version: "0.2.9"
slug: wipi-netbooter
description: WiPi-style Sega Naomi game browser and NetDIMM loader
url: https://github.com/cdmn1/wipi-ha
arch:
  - amd64
startup: application
boot: auto
webui: "http://[HOST]:[PORT:8256]"
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
ports:
  8256/tcp: 8256
ports_description:
  8256/tcp: WiPi web interface
options:
  frontend: modern
  rom_path: /media/NAOMI
  cabinets: []
  disable_crc: false
schema:
  frontend: "list(modern|classic)"
  rom_path: str
  cabinets:
    - name: str
      ip: str
      target: "list(naomi|chihiro|triforce)"
      firmware: "list(1.02|2.03|2.06|2.13|2.17|3.01|3.03|3.12|3.17|4.01|4.02)"
  disable_crc: bool
