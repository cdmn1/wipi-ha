name: Build and validate WiPi Home Assistant app

on:
  push:
    branches: [wipi-x86-port]
    paths:
      - "wipi-netbooter/**"
      - ".github/workflows/**"
      - "repository.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build amd64 app image
        run: docker build --platform linux/amd64 -t wipi-ha:test ./wipi-netbooter
      - name: Check Python syntax and NetDIMM package API
        run: |
          python3 -m py_compile wipi-netbooter/app.py
          docker run --rm wipi-ha:test python -c 'import json; from naomi.settings import NaomiSettingsManager, get_default_settings_directory; m=NaomiSettingsManager(get_default_settings_directory()); assert "BBG0.settings" in m.files; w=m.from_serial(bytes.fromhex("42424730")); assert w.serial == bytes.fromhex("42424730"); json.dumps(w.to_json()); print("Naomi EEPROM settings API and BBG0 definition verified")'
          docker run --rm wipi-ha:test python -c 'from netdimm import NetDimm, NetDimmTargetEnum, NetDimmVersionEnum; print("targets:", [x.value for x in NetDimmTargetEnum]); print("versions:", [x.value for x in NetDimmVersionEnum]); assert hasattr(NetDimm, "send") and hasattr(NetDimm, "reboot")'
          docker run --rm wipi-ha:test python -c '
          from app import apply_documented_byte_patch, apply_illvelo_force_freeplay, game_patch_options
          b = bytearray(0x620C8)
          b[0x620C6:0x620C8] = bytes.fromhex("42 84")
          p = apply_illvelo_force_freeplay(bytes(b))
          assert p[0x620C6:0x620C8] == bytes.fromhex("1A E0")
          assert p[:0x620C6] == bytes(b[:0x620C6])
          illvelo = game_patch_options({"filename": "n1-illmatic_envelope-[841-0059].bin.gz", "name": "Illmatic Envelope", "description": "Illmatic Envelope", "game_id": ""})
          assert {x["id"] for x in illvelo} == {"illvelo_force_freeplay", "illvelo_silent_attract"}
          monkey = game_patch_options({"filename": "monkeyba.zip.bin", "name": "Monkey Ball", "description": "Monkey Ball", "game_id": ""})
          assert {x["id"] for x in monkey} == {"monkey_ball_force_freeplay", "monkey_ball_silent_attract"}
          b = bytearray(0x6BEC6)
          b[0x6BE30:0x6BE32] = bytes.fromhex("42 84")
          b[0x6BEC4:0x6BEC6] = bytes.fromhex("40 63")
          p = apply_documented_byte_patch(bytes(b), "monkey_ball_force_freeplay")
          p = apply_documented_byte_patch(p, "monkey_ball_silent_attract")
          assert p[0x6BE30:0x6BE32] == bytes.fromhex("1A E0")
          assert p[0x6BEC4:0x6BEC6] == bytes.fromhex("00 E3")
          b[0x620C6:0x620C8] = bytes.fromhex("00 00")
          try:
              apply_illvelo_force_freeplay(bytes(b))
          except ValueError:
              pass
          else:
              raise AssertionError("mismatched ROM bytes were accepted")
          '
          docker run --rm wipi-ha:test python -m unittest discover -s tests -v
      - name: Smoke test web UI and API
        run: |
          mkdir -p test-share/fileset/roms test-share/fileset/csv
          printf 'sample ROM' > test-share/fileset/roms/sample.bin
          printf 'synthetic Illvelo ROM' > 'test-share/fileset/roms/n1-illmatic_envelope-[841-0059].bin.gz'
          printf 'system,romname,image,video,description,lcd_description,manufacturer,year,genre,rating,orientation,controls,enabled,favourite,openjvs,openffb,game_id,audit_name\n"Sega Naomi",sample.bin,sample.png,,Sample Game,,Test,2000,Action,,Horizontal,Digital,Yes,No,, ,BCY0,\n"Sega Naomi",n1-illmatic_envelope-[841-0059].bin.gz,illvelo.png,,Illmatic Envelope,,Sega,2003,Action,,Horizontal,Digital,Yes,No,,,\n' > test-share/fileset/csv/romsinfo.csv
          printf '{"frontend":"classic","rom_path":"/share/fileset/roms","cabinets":[{"name":"Test cabinet","ip":"127.0.0.1","target":"naomi","firmware":"4.01","power_entity":"switch.arcade"}],"disable_crc":false}' > test-options.json
          docker run -d --name wipi-ha-test -p 8256:8256 \
            -v "$PWD/test-options.json:/data/options.json:ro" \
            -v "$PWD/test-share:/share" wipi-ha:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8256/api/status >/tmp/status.json; then break; fi
            sleep 1
          done
          cat /tmp/status.json
          python3 -c 'import json; d=json.load(open("/tmp/status.json")); assert d["ok"] and d["cabinet_count"] == 1'
          curl -fsS http://127.0.0.1:8256/api/cabinets >/tmp/cabinets.json
          python3 -c 'import json; c=json.load(open("/tmp/cabinets.json"))["cabinets"][0]; assert c["power_entity"] == "switch.arcade" and c["power_state"] == "unavailable"'
          curl -sS -o /tmp/power.json -w '%{http_code}' -X POST http://127.0.0.1:8256/api/cabinets/0/power -H 'Content-Type: application/json' -d '{"action":"on"}' >/tmp/power-code
          python3 -c 'import json; assert open("/tmp/power-code").read() == "502"; assert "not enabled" in json.load(open("/tmp/power.json"))["error"]'
          curl -fsS http://127.0.0.1:8256/ >/tmp/home.html
          grep -q 'CLASSIC INTERFACE' /tmp/home.html
          curl -fsS http://127.0.0.1:8256/classic >/tmp/classic.html
          grep -q '<h2>Catalog editor</h2>' /tmp/classic.html
          grep -q 'CATALOG EDITOR' /tmp/classic.html
          grep -q 'data-power="on"' /tmp/classic.html
          grep -q 'SAVE CATALOG ENTRY' /tmp/classic.html
          grep -q 'romBase=g.filename.replace' /tmp/classic.html
          grep -q '<select id="edit-system"' /tmp/classic.html
          ! grep -q 'LCD description' /tmp/classic.html
          curl -fsS http://127.0.0.1:8256/modern >/tmp/modern.html
          grep -q 'Open Classic interface' /tmp/modern.html
          grep -q 'POWER ON' /tmp/modern.html
          grep -q 'setCabinetPower' /tmp/modern.html
          curl -fsS http://127.0.0.1:8256/api/games >/tmp/games.json
          python3 -c 'import json; d=json.load(open("/tmp/games.json")); assert len(d["games"]) == 2 and d["systems"] == ["Sega Naomi"]; sample=next(g for g in d["games"] if g["filename"] == "sample.bin"); assert sample["name"] == "Sample Game" and sample["genre"] == "Action"; ill=next(g for g in d["games"] if g["filename"].startswith("n1-")); assert ill["patchable"] is True'
          curl -fsS http://127.0.0.1:8256/api/games/sample.bin/patches >/tmp/patches.json
          curl -fsS 'http://127.0.0.1:8256/api/games/n1-illmatic_envelope-%5B841-0059%5D.bin.gz/patches' >/tmp/illvelo-patches.json
          python3 -c 'import json; p=json.load(open("/tmp/illvelo-patches.json"))["patches"]; assert {x["id"] for x in p} == {"illvelo_force_freeplay", "illvelo_silent_attract"} and not any(x["enabled"] for x in p)'
          python3 -c 'import json; assert json.load(open("/tmp/patches.json"))["patches"] == []'
          curl -sS -o /tmp/save-patches.json -w '%{http_code}' -X POST http://127.0.0.1:8256/api/games/sample.bin/patches -H 'Content-Type: application/json' -d '{"patches":["naomi_region_unlock"]}' >/tmp/save-patches-code
          python3 -c 'import json; assert open("/tmp/save-patches-code").read() == "400"; assert not json.load(open("/tmp/save-patches.json"))["ok"]'
          curl -fsS http://127.0.0.1:8256/api/games/sample.bin/patches >/tmp/patches-saved.json
          python3 -c 'import json; assert json.load(open("/tmp/patches-saved.json"))["patches"] == []'
          curl -fsS -X POST http://127.0.0.1:8256/api/catalogue -H 'Content-Type: application/json' -d '{"romname":"sample.bin","description":"Edited Sample","system":"Sega Naomi","manufacturer":"Test","year":"2000","genre":"Action","orientation":"Horizontal","controls":"Digital (Stick)","enabled":true,"favourite":true}' >/tmp/catalogue.json
          python3 -c 'import json; d=json.load(open("/tmp/catalogue.json")); assert d["ok"]'
          curl -fsS http://127.0.0.1:8256/api/games >/tmp/updated-games.json
          python3 -c 'import json; g=json.load(open("/tmp/updated-games.json"))["games"][0]; assert g["name"] == "Edited Sample" and g["favourite"] and g["catalogued"]'
          python3 -c 'import csv; p="test-share/fileset/csv/romsinfo.csv"; f=open(p,newline=""); r=csv.reader(f); h=next(r); assert h == ["system","romname","image","video","description","lcd_description","manufacturer","year","genre","rating","orientation","controls","enabled","favourite","openjvs","openffb","game_id","audit_name"]'
          docker rm -f wipi-ha-test
      - name: Cleanup
        if: always()
        run: docker rm -f wipi-ha-test || true
