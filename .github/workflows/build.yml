name: Build and validate WiPi Home Assistant app

on:
  push:
    branches: [wipi-x86-port]
    paths:
      - "wipi-netbooter/**"
      - ".github/workflows/**"
      - "repository.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build amd64 app image
        run: docker build --platform linux/amd64 -t wipi-ha:test ./wipi-netbooter
      - name: Check Python syntax and NetDIMM package API
        run: |
          python3 -m py_compile wipi-netbooter/app.py
          docker run --rm wipi-ha:test python -c 'from netdimm import NetDimm, NetDimmTargetEnum, NetDimmVersionEnum; print("targets:", [x.value for x in NetDimmTargetEnum]); print("versions:", [x.value for x in NetDimmVersionEnum]); assert hasattr(NetDimm, "send") and hasattr(NetDimm, "reboot")'
      - name: Smoke test web UI and API
        run: |
          mkdir -p test-share/fileset/roms test-share/fileset/csv
          printf 'sample ROM' > test-share/fileset/roms/sample.bin
          printf 'system,romname,image,video,description,lcd_description,manufacturer,year,genre,rating,orientation,controls,enabled,favourite,openjvs,openffb,game_id,audit_name\n"Sega Naomi",sample.bin,sample.png,,Sample Game,,Test,2000,Action,,Horizontal,Digital,Yes,No,,,,\n' > test-share/fileset/csv/romsinfo.csv
          printf '{"frontend":"classic","rom_path":"/share/fileset/roms","cabinets":[{"name":"Test cabinet","ip":"127.0.0.1","target":"naomi","firmware":"4.01"}],"disable_crc":false}' > test-options.json
          docker run -d --name wipi-ha-test -p 8256:8256 \
            -v "$PWD/test-options.json:/data/options.json:ro" \
            -v "$PWD/test-share:/share" wipi-ha:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8256/api/status >/tmp/status.json; then break; fi
            sleep 1
          done
          cat /tmp/status.json
          python3 -c 'import json; d=json.load(open("/tmp/status.json")); assert d["ok"] and d["cabinet_count"] == 1'
          curl -fsS http://127.0.0.1:8256/ >/tmp/home.html
          grep -q 'CLASSIC INTERFACE' /tmp/home.html
          curl -fsS http://127.0.0.1:8256/classic >/dev/null
          curl -fsS http://127.0.0.1:8256/modern >/tmp/modern.html
          grep -q 'Open Classic interface' /tmp/modern.html
          curl -fsS http://127.0.0.1:8256/api/games >/tmp/games.json
          python3 -c 'import json; d=json.load(open("/tmp/games.json")); assert len(d["games"]) == 1 and d["games"][0]["name"] == "Sample Game" and d["games"][0]["genre"] == "Action"'
          curl -fsS -X POST http://127.0.0.1:8256/api/catalogue -H 'Content-Type: application/json' -d '{"romname":"sample.bin","description":"Edited Sample","system":"Sega Naomi","manufacturer":"Test","year":"2000","genre":"Action","orientation":"Horizontal","controls":"Digital (Stick)","enabled":true,"favourite":true}' >/tmp/catalogue.json
          python3 -c 'import json; d=json.load(open("/tmp/catalogue.json")); assert d["ok"]'
          curl -fsS http://127.0.0.1:8256/api/games >/tmp/updated-games.json
          python3 -c 'import json; g=json.load(open("/tmp/updated-games.json"))["games"][0]; assert g["name"] == "Edited Sample" and g["favourite"] and g["catalogued"]'
          python3 -c 'import csv; p="test-share/fileset/csv/romsinfo.csv"; f=open(p,newline=""); r=csv.reader(f); h=next(r); assert h == ["system","romname","image","video","description","lcd_description","manufacturer","year","genre","rating","orientation","controls","enabled","favourite","openjvs","openffb","game_id","audit_name"]'
          docker rm -f wipi-ha-test
      - name: Cleanup
        if: always()
        run: docker rm -f wipi-ha-test || true
