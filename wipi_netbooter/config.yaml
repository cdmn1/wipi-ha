name: WiPi Netbooter
version: "0.2.0"
slug: wipi-netbooter
description: WiPi-style Sega Naomi game browser and NetDIMM loader
url: https://github.com/cdmn1/wipi-ha
arch:
  - amd64
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8256]"
map:
  - type: media
    read_only: true
  - type: share
    read_only: true
ports:
  8256/tcp: 8256
ports_description:
  8256/tcp: WiPi web interface
options:
  rom_path: /media/NAOMI
  cabinets: []
  disable_crc: false
schema:
  rom_path: str
  cabinets:
    - str
  disable_crc: bool
