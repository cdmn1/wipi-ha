name: WiPi Netbooter
slug: wipi_netbooter
description: Browser-based Sega Naomi NetDIMM netboot manager for Home Assistant
version: 0.1.0
url: https://github.com/cdmn1/wipi-ha
arch:
  - amd64
startup: application
boot: auto
init: false
ports:
  8256/tcp: 8256
ports_description:
  8256/tcp: WiPi web interface
map:
